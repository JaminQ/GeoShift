name: Build GeoShift APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Android SDK
      uses: actions/cache@v4
      with:
        path: |
          ~/Android/Sdk
          ~/.android
        key: android-sdk-34
        restore-keys: android-sdk-34

    - name: Install Android SDK (with retry and mirror)
      shell: bash
      run: |
        ANDROID_HOME=$HOME/Android/Sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        cd $ANDROID_HOME/cmdline-tools
        
        # Only download if not cached
        if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
          echo "Downloading cmdline-tools..."
          for url in \
            "https://repo.huaweicloud.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"; do
            echo "Trying $url"
            curl -fsSL --retry 3 --retry-delay 5 "$url" -o cmdline-tools.zip && break || echo "Failed"
          done
          unzip -q cmdline-tools.zip && rm cmdline-tools.zip
          mv cmdline-tools latest
          
          export ANDROID_HOME=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          
          echo "Accepting licenses..."
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null
          
          echo "Installing packages..."
          yes | sdkmanager --sdk_root=$ANDROID_HOME --no_https "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        else
          echo "SDK already cached, skipping download"
        fi

    - name: Fix build config
      shell: bash
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
      run: |
        cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                maven { url 'https://repo.huaweicloud.com/repository/maven/google' }
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                maven { url 'https://repo.huaweicloud.com/repository/maven/google' }
                mavenCentral()
            }
        }
        rootProject.name = "GeoShift"
        include ':app'
        EOF
        echo "sdk.dir=$HOME/Android/Sdk" > local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build Debug APK
      shell: bash
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
      run: |
        export ANDROID_HOME=$HOME/Android/Sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
        ./gradlew assembleDebug --no-daemon --stacktrace --info

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: geoshift-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
