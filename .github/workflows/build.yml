name: Build GeoShift APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: '34.0.0'

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Inject google Maven repo URL
      shell: bash
      run: |
        sed -i "s/mavenCentral()/maven { url 'https:\/\/maven.google.com' }\n        mavenCentral()/" settings.gradle

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace --info

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: geoshift-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
