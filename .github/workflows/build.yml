name: Build GeoShift APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK (official action)
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        ndk: '25.1.8937393'
        cmake: '3.22.1'

    - name: Fix build.gradle - inject explicit Maven repositories
      shell: bash
      run: |
        # Add repositories to root build.gradle
        sed -i '/^plugins {/a\    repositories {\n        maven { url "https://maven.google.com" }\n        mavenCentral()\n    }' build.gradle
        # Add repositories to app build.gradle  
        sed -i '/^plugins {/a\    repositories {\n        maven { url "https://maven.google.com" }\n        mavenCentral()\n    }' app/build.gradle
        # Change FAIL_ON_PROJECT_REPOS to PREFER_SETTINGS
        sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_SETTINGS/' settings.gradle
        echo "=== build.gradle ===" && cat build.gradle
        echo "=== app/build.gradle ===" && cat app/build.gradle
        echo "=== settings.gradle ===" && cat settings.gradle

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace --info

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: geoshift-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
