name: Build GeoShift APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Enable auto SDK download in gradle.properties
      shell: bash
      run: |
        # Enable AGP to auto-download missing SDK components
        mkdir -p ~/.gradle
        cat > ~/.gradle/gradle.properties << 'EOF'
        android.builder.sdkDownload=true
        android.sdk.channel=0
        EOF

    - name: Fix build config
      shell: bash
      run: |
        cat > settings.gradle << 'EOF'
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                mavenCentral()
            }
        }
        rootProject.name = "GeoShift"
        include ':app'
        EOF

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build Debug APK
      shell: bash
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace --info

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: geoshift-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
