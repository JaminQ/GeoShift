name: Build GeoShift APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install Android SDK manually
      shell: bash
      run: |
        ANDROID_HOME=$HOME/Android/Sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        cd $ANDROID_HOME/cmdline-tools
        curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o cmdline-tools.zip
        unzip -q cmdline-tools.zip && rm cmdline-tools.zip
        mv cmdline-tools latest
        export ANDROID_HOME=$ANDROID_HOME
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
        yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null
        yes | sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Fix build.gradle - add explicit Maven repo and local.properties
      shell: bash
      run: |
        echo "sdk.dir=$HOME/Android/Sdk" > local.properties
        # Inject repositories block AND fix settings.gradle in one shot
        sed -i '/plugins {/a\    repositories {\n        maven { url "https://maven.google.com" }\n        mavenCentral()\n    }\n' app/build.gradle
        # Also fix root build.gradle
        sed -i '/plugins {/a\    repositories {\n        maven { url "https://maven.google.com" }\n        mavenCentral()\n    }\n' build.gradle
        # Fix settings.gradle - change FAIL_ON_PROJECT_REPOS to PREFER_SETTINGS
        sed -i 's/FAIL_ON_PROJECT_REPOS/PREFER_SETTINGS/' settings.gradle
        echo "=== app/build.gradle ==="
        cat app/build.gradle
        echo "=== settings.gradle ==="
        cat settings.gradle

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build Debug APK
      shell: bash
      run: |
        export ANDROID_HOME=$HOME/Android/Sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
        ./gradlew assembleDebug --no-daemon --stacktrace --info

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: geoshift-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
