name: Build GeoShift APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: '34.0.0'

    - name: Configure SDK and build mirrors
      shell: bash
      run: |
        # Point sdkmanager to Huawei mirror
        sed -i 's#https://dl.google.com/android/repository#https://repo.huaweicloud.com/android/repository#g' $ANDROID_HOME/cmdline-tools/latest/sdkmanager
        # Rewrite settings.gradle to use Huawei Maven mirror for google()
        cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                maven { url 'https://repo.huaweicloud.com/repository/maven/google' }
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                maven { url 'https://repo.huaweicloud.com/repository/maven/google' }
                mavenCentral()
            }
        }
        rootProject.name = "GeoShift"
        include ':app'
        EOF
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "=== ANDROID_HOME=$ANDROID_HOME ==="
        echo "=== settings.gradle ===" && cat settings.gradle

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace --info

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: geoshift-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
