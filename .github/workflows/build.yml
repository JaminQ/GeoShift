name: Build GeoShift APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix build config
      shell: bash
      run: |
        # settings.gradle: keep google() for pluginManagement, mavenCentral for deps
        cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                mavenCentral()
            }
        }
        rootProject.name = "GeoShift"
        include ':app'
        EOF

        # build.gradle: remove Play Services dependency
        sed -i "/play-services-location/d" app/build.gradle

    - name: Build Debug APK
      shell: bash
      run: |
        gradle assembleDebug --no-daemon --stacktrace --info

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: geoshift-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
